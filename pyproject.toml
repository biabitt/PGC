[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pgc"
version = "0.1.0"
description = "Simulação de um protocolo de autenticação mútua para MEC baseado em emparelhamento bilinear, incluindo um ataque de personificação do provedor de serviço."
requires-python = ">=3.10"
dependencies = [
    "py-ecc>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools]
py-modules = ["main", "cenarios"]

[tool.setuptools.packages.find]
include = ["protocolo*", "criptografia*", "ataque*"]
